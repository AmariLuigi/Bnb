<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albergheria Quarter - Sant'Agostino BnB Palermo Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .language-selector label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        .language-selector select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body class="quarter-page albergheria-bg">
    <div class="language-selector">
        <label for="language-selector" data-i18n="language">Language</label>
        <select id="language-selector" onchange="updatePageLanguage(this.value)">
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="container">
        <header>
            <h1 data-i18n="albergheria">Albergheria Quarter</h1>
            <a href="index.html" class="back-btn" data-i18n="back">← Back to Map</a>
        </header>
        
        <div class="quarter-info">
            <div class="qr-section">
                <h2 data-i18n="scanVisit">Scan to visit this page</h2>
                <div id="page-qrcode" class="qrcode-large"></div>
                <button id="printQR" class="btn" data-i18n="printQR">Print QR Code</button>
            </div>
            
            <div class="attractions">
                <h2 data-i18n="placesToVisit">Places to Visit</h2>
                <ul id="attractions-list">
                    <!-- Attractions will be loaded dynamically by JavaScript -->
                </ul>
            </div>
        </div>
        
        <footer>
            <p data-i18n="copyright">© Sant'Agostino BnB - Palermo Map</p>
        </footer>
    </div>
    
    <script src="js/qrcode.min.js"></script>
    <script src="js/translations.js"></script>
    <script>
        // Generate QR Code for this page
        const currentUrl = window.location.href;
        new QRCode(document.getElementById("page-qrcode"), {
            text: currentUrl,
            width: 200,
            height: 200
        });
        
        // Print QR Code functionality
        document.getElementById('printQR').addEventListener('click', function() {
            const printWindow = window.open('', '', 'width=600,height=600');
            const qrImage = document.getElementById('page-qrcode').querySelector('img').src;
            const currentLang = localStorage.getItem('preferred_language') || 'en';
            const quarterName = getTranslation('albergheria', currentLang);
            const scanText = getTranslation('scanToExplore', currentLang);
            const scanSuffix = getTranslation('scanToExploreSuffix', currentLang);
            const quarterSuffix = getTranslation('quarterSuffix', currentLang);
            
            printWindow.document.write(`
                <html>
                <head>
                    <title>${quarterName} ${quarterSuffix}</title>
                    <style>
                        body { font-family: Arial, sans-serif; text-align: center; }
                        .qr-container { margin: 20px auto; }
                        h1 { margin-bottom: 30px; }
                    </style>
                </head>
                <body>
                    <h1>${quarterName} - Sant'Agostino BnB</h1>
                    <div class="qr-container">
                        <img src="${qrImage}" alt="QR Code for ${quarterName}">
                        <p>${scanText} ${quarterName} ${scanSuffix}</p>
                    </div>
                </body>
                </html>
            `);
            
            printWindow.document.close();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 250);
        });
    </script>
</body>
</html>
