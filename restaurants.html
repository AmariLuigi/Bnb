<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - Sant'Agostino BnB Palermo Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Enable smooth scrolling on the entire document */
        html {
            scroll-behavior: smooth;
        }
        
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .language-selector label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        .language-selector select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        .restaurant-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            overflow: hidden;
            height: 450px;
            position: relative;
            transition: transform 0.3s;
        }
        
        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .restaurant-image {
            height: 150px;
            overflow: hidden;
            position: relative;
        }
        
        .restaurant-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .restaurant-card:hover .restaurant-image img {
            transform: scale(1.05);
        }
        
        .restaurant-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: calc(100% - 150px);
        }
        
        .restaurant-details h3 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }
        
        .description-container {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        
        .truncated-text {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            line-height: 1.5;
            max-height: 4.5em;
            margin-bottom: 10px;
            transition: max-height 0.3s;
        }
        
        .expanded-text {
            overflow-y: auto;
            max-height: 120px;
            line-height: 1.5;
            margin-bottom: 10px;
            padding-right: 5px;
        }
        
        .expanded-text::-webkit-scrollbar {
            width: 4px;
        }
        
        .expanded-text::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .expanded-text::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        .expanded-text::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        .see-more-btn {
            color: rgb(185, 43, 19);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .see-more-btn:hover {
            text-decoration: underline;
        }
        
        .restaurant-meta {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            font-size: 0.9rem;
        }
        
        .restaurant-meta-item {
            display: flex;
            align-items: center;
            color: #666;
            margin-bottom: 10px;
            flex-basis: 48%;
        }
        
        .restaurant-meta-item i {
            margin-right: 8px;
            color: rgb(185, 43, 19);
        }
        
        .get-directions {
            display: inline-block;
            background-color: rgb(185, 43, 19);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
            text-align: center;
            margin-top: 15px;
        }
        
        .get-directions:hover {
            background-color: rgb(155, 33, 9);
        }
        
        .section-title {
            font-size: 1.8rem;
            color: #333;
            margin: 30px 0 20px;
            border-bottom: 2px solid rgb(185, 43, 19);
            padding-bottom: 8px;
            display: inline-block;
        }
        
        .section-title span {
            color: rgb(185, 43, 19);
        }
        
        .view-menu-btn {
            display: inline-block;
            background-color: rgb(185, 43, 19);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .view-menu-btn:hover {
            background-color: rgb(155, 33, 9);
        }
        
        .attractions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
        }
        
        @media (max-width: 992px) {
            .attractions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .attractions-grid {
                grid-template-columns: 1fr;
            }
            
            .restaurant-card {
                height: auto;
            }
        }
        
        /* Additional Styles */
        .version-info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body class="page-bg">
    <div class="language-selector">
        <label for="language-selector" data-i18n="language">Language</label>
        <select id="language-selector" onchange="updatePageLanguage(this.value)">
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="container">
        <header>
            <h1><span style="color: rgb(185, 43, 19);" data-i18n="restaurants">Restaurants</span></h1>
            <a href="index.html" class="back-btn" data-i18n="back">← Back to Map</a>
        </header>
        
        <div class="quarter-content">
            <div class="attractions">
                <h2 data-i18n="recommendedRestaurants">Recommended Restaurants</h2>
                <div id="restaurants-grid" class="attractions-grid">
                    <!-- Restaurants will be loaded dynamically by JavaScript -->
                </div>
            </div>
        </div>
        
        <footer>
            <p data-i18n="copyright">© Sant'Agostino BnB - Palermo Map</p>
            <p class="version-info">Version 1.2.1</p>
        </footer>
    </div>
    
    <script src="js/qrcode.min.js"></script>
    <script src="js/translations.js"></script>
    <script>
        // Ensure restaurants are initialized on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Force restaurants to load
            const savedLang = localStorage.getItem('preferred_language') || 'en';
            updatePageLanguage(savedLang);
            
            // Check for hash in URL and scroll to it
            if (window.location.hash) {
                setTimeout(() => {
                    const targetElement = document.querySelector(window.location.hash);
                    if (targetElement) {
                        targetElement.scrollIntoView({behavior: 'smooth', block: 'start'});
                    }
                }, 500);
            }
            
            // Add event listener for "See more" buttons
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('see-more-btn')) {
                    const textElement = e.target.previousElementSibling;
                    const card = e.target.closest('.restaurant-card');
                    
                    // Toggle expanded state with a class
                    if (textElement.classList.contains('truncated-text')) {
                        // Remove truncation and make scrollable
                        textElement.classList.remove('truncated-text');
                        textElement.classList.add('expanded-text');
                        e.target.textContent = 'See less';
                    } else {
                        // Add truncation back
                        textElement.classList.add('truncated-text');
                        textElement.classList.remove('expanded-text');
                        e.target.textContent = 'See more';
                    }
                }
            });
        });
        
        function createRestaurantCard(restaurant) {
            const restaurantCard = document.createElement('div');
            restaurantCard.className = 'restaurant-card';
            // Add a unique ID to each card for direct targeting
            restaurantCard.id = 'restaurant-' + restaurant.name.replace(/[^a-z0-9]/gi, '-').toLowerCase();
            
            // Image container
            const imageContainer = document.createElement('div');
            imageContainer.className = 'restaurant-image';
            
            // Generate SVG placeholder
            const imageContent = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            imageContent.setAttribute('width', '100%');
            imageContent.setAttribute('height', '100%');
            imageContent.setAttribute('viewBox', '0 0 100 100');
            imageContent.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('width', '100');
            bg.setAttribute('height', '100');
            bg.setAttribute('fill', 'rgb(185, 43, 19)');
            
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '50');
            text.setAttribute('y', '50');
            text.setAttribute('font-family', 'Arial');
            text.setAttribute('font-size', '14');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'middle');
            text.setAttribute('fill', 'white');
            text.textContent = restaurant.name.substring(0, 1).toUpperCase();
            
            imageContent.appendChild(bg);
            imageContent.appendChild(text);
            
            // Restaurant details
            const detailsContainer = document.createElement('div');
            detailsContainer.className = 'restaurant-details';
            
            // Restaurant name
            const name = document.createElement('h3');
            name.textContent = restaurant.name;
            
            // Create description container
            const descriptionContainer = document.createElement('div');
            descriptionContainer.className = 'description-container';
            
            // Restaurant description with truncation
            const description = document.createElement('p');
            description.className = 'truncated-text';
            description.textContent = restaurant.description;
            
            // See more button
            const seeMoreBtn = document.createElement('span');
            seeMoreBtn.className = 'see-more-btn';
            seeMoreBtn.textContent = 'See more';
            
            // Restaurant meta information
            const metaContainer = document.createElement('div');
            metaContainer.className = 'restaurant-meta';
            
            // Meta items with icons
            const priceRange = document.createElement('div');
            priceRange.className = 'restaurant-meta-item';
            priceRange.innerHTML = `<i class="price-icon">€</i> ${restaurant.priceRange}`;
            
            const cuisine = document.createElement('div');
            cuisine.className = 'restaurant-meta-item';
            cuisine.innerHTML = `<i class="cuisine-icon">🍽️</i> ${restaurant.cuisine}`;
            
            const openHours = document.createElement('div');
            openHours.className = 'restaurant-meta-item';
            openHours.innerHTML = `<i class="clock-icon">🕒</i> ${restaurant.openHours}`;
            
            const meals = document.createElement('div');
            meals.className = 'restaurant-meta-item';
            meals.innerHTML = `<i class="meal-icon">🍴</i> ${restaurant.meals}`;
            
            // Get directions button
            const directionsButton = document.createElement('a');
            directionsButton.href = `https://maps.google.com/?q=${encodeURIComponent(restaurant.name + ', ' + restaurant.address)}`;
            directionsButton.className = 'get-directions';
            directionsButton.textContent = getTranslation('getDirections', localStorage.getItem('preferred_language') || 'en');
            directionsButton.target = '_blank';
            
            // Append all elements
            imageContainer.appendChild(imageContent);
            restaurantCard.appendChild(imageContainer);
            
            metaContainer.appendChild(priceRange);
            metaContainer.appendChild(cuisine);
            metaContainer.appendChild(openHours);
            metaContainer.appendChild(meals);
            
            descriptionContainer.appendChild(description);
            descriptionContainer.appendChild(seeMoreBtn);
            
            detailsContainer.appendChild(name);
            detailsContainer.appendChild(descriptionContainer);
            detailsContainer.appendChild(metaContainer);
            detailsContainer.appendChild(directionsButton);
            
            restaurantCard.appendChild(detailsContainer);
            
            return restaurantCard;
        }
        
        // Override the updatePageLanguage function to handle restaurant content
        function updatePageLanguage(lang) {
            // Set the selected language
            const langSelector = document.getElementById('language-selector');
            if (langSelector) {
                langSelector.value = lang;
            }
            
            // Store preferred language
            localStorage.setItem('preferred_language', lang);
            
            // Update all data-i18n elements
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                element.textContent = getTranslation(key, lang);
            });
            
            // Get restaurant data for the selected language
            const restaurantsData = getTranslation('restaurantsData', lang);
            
            // Clear previous content
            const restaurantsContainer = document.querySelector('.attractions');
            const existingGrids = restaurantsContainer.querySelectorAll('.restaurants-section');
            existingGrids.forEach(grid => grid.remove());
            
            // Create lunch section
            const lunchSection = document.createElement('div');
            lunchSection.className = 'restaurants-section';
            
            const lunchTitle = document.createElement('h3');
            lunchTitle.className = 'section-title';
            lunchTitle.setAttribute('data-i18n', 'lunchRestaurants');
            
            // Create span inside title for styling consistency
            const lunchTitleText = document.createElement('span');
            lunchTitleText.textContent = getTranslation('lunchRestaurants', lang);
            lunchTitle.appendChild(lunchTitleText);
            
            const lunchGrid = document.createElement('div');
            lunchGrid.id = 'lunch-restaurants-grid';
            lunchGrid.className = 'attractions-grid';
            
            lunchSection.appendChild(lunchTitle);
            lunchSection.appendChild(lunchGrid);
            
            // Create dinner section
            const dinnerSection = document.createElement('div');
            dinnerSection.className = 'restaurants-section';
            
            const dinnerTitle = document.createElement('h3');
            dinnerTitle.className = 'section-title';
            dinnerTitle.setAttribute('data-i18n', 'dinnerRestaurants');
            
            // Create span inside title for styling consistency
            const dinnerTitleText = document.createElement('span');
            dinnerTitleText.textContent = getTranslation('dinnerRestaurants', lang);
            dinnerTitle.appendChild(dinnerTitleText);
            
            const dinnerGrid = document.createElement('div');
            dinnerGrid.id = 'dinner-restaurants-grid';
            dinnerGrid.className = 'attractions-grid';
            
            dinnerSection.appendChild(dinnerTitle);
            dinnerSection.appendChild(dinnerGrid);
            
            // Add sections to the container
            restaurantsContainer.appendChild(lunchSection);
            restaurantsContainer.appendChild(dinnerSection);
            
            // Populate each section
            
            // Filter and add lunch restaurants
            const lunchRestaurants = restaurantsData.filter(restaurant => 
                restaurant.type === 'Lunch' || restaurant.type === 'Pranzo'
            );
            
            lunchRestaurants.forEach(restaurant => {
                const card = createRestaurantCard(restaurant);
                lunchGrid.appendChild(card);
            });
            
            // Filter and add dinner restaurants
            const dinnerRestaurants = restaurantsData.filter(restaurant => 
                restaurant.type === 'Dinner' || restaurant.type === 'Cena'
            );
            
            dinnerRestaurants.forEach(restaurant => {
                const card = createRestaurantCard(restaurant);
                dinnerGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
