<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalsa Quarter - Sant'Agostino BnB Palermo Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .language-selector label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        .language-selector select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body class="quarter-page kalsa-bg">
    <div class="language-selector">
        <label for="language-selector" data-i18n="language">Language</label>
        <select id="language-selector" onchange="updatePageLanguage(this.value)">
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="container">
        <header>
            <h1 data-i18n="kalsa">Kalsa Quarter</h1>
            <a href="index.html" class="back-btn" data-i18n="back">← Back to Map</a>
        </header>
        
        <div class="quarter-content">
            <div class="attractions">
                <h2 data-i18n="placesToVisit">Places to Visit</h2>
                <div id="attractions-grid" class="attractions-grid">
                    <!-- Attractions will be loaded dynamically by JavaScript -->
                </div>
            </div>
        </div>
        
        <footer>
            <p data-i18n="copyright">© Sant'Agostino BnB - Palermo Map</p>
        </footer>
    </div>
    
    <script src="js/qrcode.min.js"></script>
    <script src="js/translations.js"></script>
</body>
</html>
