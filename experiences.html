<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&B Experiences - Sant'Agostino BnB Palermo Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Enable smooth scrolling on the entire document */
        html {
            scroll-behavior: smooth;
        }
        
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .language-selector label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        .language-selector select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        .experience-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            overflow: hidden;
            height: 470px;
            position: relative;
            transition: transform 0.3s;
        }
        
        .experience-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .experience-image {
            height: 150px;
            overflow: hidden;
            position: relative;
        }
        
        .experience-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .experience-card:hover .experience-image img {
            transform: scale(1.05);
        }
        
        .experience-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: calc(100% - 150px);
        }
        
        .experience-details h3 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }
        
        .description-container {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        
        .truncated-text {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            line-height: 1.5;
            max-height: 4.5em;
            margin-bottom: 10px;
            transition: max-height 0.3s;
            color: #666;
        }
        
        .expanded-text {
            overflow-y: auto;
            max-height: 120px;
            line-height: 1.5;
            margin-bottom: 10px;
            padding-right: 5px;
            color: #666;
        }
        
        .expanded-text::-webkit-scrollbar {
            width: 4px;
        }
        
        .expanded-text::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .expanded-text::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        .expanded-text::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        .see-more-btn {
            color: rgb(185, 43, 19);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 5px;
        }
        
        .see-more-btn:hover {
            text-decoration: underline;
        }
        
        .experience-meta {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        
        .experience-meta-item {
            display: flex;
            align-items: center;
            color: #666;
            margin-bottom: 10px;
            flex-basis: 48%;
        }
        
        .experience-meta-item i {
            margin-right: 8px;
            color: rgb(185, 43, 19);
        }
        
        .book-now {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(185, 43, 19);
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
            font-size: 0.9rem;
            margin-left: auto;
            border: none;
            cursor: pointer;
        }
        
        .book-now i {
            margin-right: 5px;
        }
        
        .book-now:hover {
            background-color: rgb(155, 33, 9);
        }
        
        .experience-note {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid rgb(185, 43, 19);
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .experience-note i {
            margin-right: 8px;
            color: rgb(185, 43, 19);
        }
        
        .section-title {
            font-size: 1.8rem;
            color: #333;
            margin: 30px 0 20px;
            border-bottom: 2px solid rgb(185, 43, 19);
            padding-bottom: 8px;
            display: inline-block;
        }
        
        .section-title span {
            color: rgb(185, 43, 19);
        }
        
        .attractions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
        }
        
        @media (max-width: 992px) {
            .attractions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .attractions-grid {
                grid-template-columns: 1fr;
            }
            
            .experience-card {
                height: auto;
            }
        }
        
        /* Additional Styles */
        .version-info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body class="page-bg">
    <div class="language-selector">
        <label for="language-selector" data-i18n="language">Language</label>
        <select id="language-selector" onchange="updatePageLanguage(this.value)">
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="container">
        <header>
            <h1><span style="color: rgb(185, 43, 19);">B&B</span> <span style="color: #333;" data-i18n="experiences">Experiences</span></h1>
            <a href="index.html" class="back-btn" data-i18n="back">← Back to Map</a>
        </header>
        
        <div class="quarter-content">
            <div class="attractions">
                <h2 class="section-title"><span data-i18n="localExperiences">Local Experiences</span></h2>
                <p data-i18n="experiencesIntro">Discover authentic Sicilian experiences with our local partners</p>
                <div id="experiences-grid" class="attractions-grid">
                    <!-- Experiences will be loaded dynamically by JavaScript -->
                </div>
            </div>
        </div>
        
        <footer>
            <p data-i18n="copyright">© Sant'Agostino BnB - Palermo Map</p>
            <p class="version-info">Version 1.2.2</p>
        </footer>
    </div>
    
    <script src="js/qrcode.min.js"></script>
    <script src="js/translations.js"></script>
    <script>
        // Ensure experiences are initialized on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Force experiences to load
            const savedLang = localStorage.getItem('preferred_language') || 'en';
            updatePageLanguage(savedLang);
            
            // Check for hash in URL and scroll to it
            if (window.location.hash) {
                setTimeout(() => {
                    const targetElement = document.querySelector(window.location.hash);
                    if (targetElement) {
                        targetElement.scrollIntoView({behavior: 'smooth', block: 'start'});
                    }
                }, 500);
            }
            
            // Add event listener for "See more" buttons
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('see-more-btn')) {
                    const textElement = e.target.previousElementSibling;
                    const card = e.target.closest('.experience-card');
                    
                    // Toggle expanded state with a class
                    if (textElement.classList.contains('truncated-text')) {
                        // Remove truncation and make scrollable
                        textElement.classList.remove('truncated-text');
                        textElement.classList.add('expanded-text');
                        e.target.textContent = 'See less';
                    } else {
                        // Add truncation back
                        textElement.classList.add('truncated-text');
                        textElement.classList.remove('expanded-text');
                        e.target.textContent = 'See more';
                    }
                }
            });
        });
        
        function createExperienceCard(experience) {
            const experienceCard = document.createElement('div');
            experienceCard.className = 'experience-card';
            // Add a unique ID to each card for direct targeting
            experienceCard.id = 'experience-' + experience.name.replace(/[^a-z0-9]/gi, '-').toLowerCase();
            
            // Image container
            const imageContainer = document.createElement('div');
            imageContainer.className = 'experience-image';
            
            // Generate SVG placeholder
            const imageContent = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            imageContent.setAttribute('width', '100%');
            imageContent.setAttribute('height', '100%');
            imageContent.setAttribute('viewBox', '0 0 100 100');
            imageContent.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('width', '100');
            bg.setAttribute('height', '100');
            bg.setAttribute('fill', 'rgb(185, 43, 19)');
            
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '50');
            text.setAttribute('y', '50');
            text.setAttribute('font-family', 'Arial');
            text.setAttribute('font-size', '14');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'middle');
            text.setAttribute('fill', 'white');
            text.textContent = experience.name.substring(0, 1).toUpperCase();
            
            imageContent.appendChild(bg);
            imageContent.appendChild(text);
            
            // Experience details
            const detailsContainer = document.createElement('div');
            detailsContainer.className = 'experience-details';
            
            // Experience name
            const name = document.createElement('h3');
            name.textContent = experience.name;
            
            // Create description container
            const descriptionContainer = document.createElement('div');
            descriptionContainer.className = 'description-container';
            
            // Experience description with truncation
            const description = document.createElement('p');
            description.className = 'truncated-text';
            description.textContent = experience.description || 'No description available';
            
            // See more button
            const seeMoreBtn = document.createElement('span');
            seeMoreBtn.className = 'see-more-btn';
            seeMoreBtn.textContent = 'See more';
            
            // Experience note if available
            let note = null;
            if (experience.note) {
                note = document.createElement('p');
                note.className = 'experience-note';
                note.innerHTML = `<i class="note-icon">ℹ️</i> ${experience.note}`;
            }
            
            // Experience meta information
            const metaContainer = document.createElement('div');
            metaContainer.className = 'experience-meta';
            
            // Add duration
            const duration = document.createElement('div');
            duration.className = 'experience-meta-item';
            duration.innerHTML = `<i class="duration-icon">⏱️</i> ${experience.duration || 'Duration not specified'}`;
            
            // Add price
            const price = document.createElement('div');
            price.className = 'experience-meta-item';
            price.innerHTML = `<i class="price-icon">€</i> ${experience.price || 'Price not available'}`;
            
            // Row for the book button
            const bookRow = document.createElement('div');
            bookRow.style.display = 'flex';
            bookRow.style.width = '100%';
            bookRow.style.justifyContent = 'flex-end';
            bookRow.style.marginTop = '10px';
            
            // Book button with icon
            const bookButton = document.createElement('button');
            bookButton.className = 'book-now';
            bookButton.innerHTML = `<i class="book-icon">📅</i> ${getTranslation('bookNow', localStorage.getItem('preferred_language') || 'en')}`;
            
            // Add event listener to the book button
            bookButton.addEventListener('click', function() {
                alert(getTranslation('contactMessage', localStorage.getItem('preferred_language') || 'en'));
            });
            
            // Append all elements
            imageContainer.appendChild(imageContent);
            experienceCard.appendChild(imageContainer);
            
            metaContainer.appendChild(duration);
            metaContainer.appendChild(price);
            
            descriptionContainer.appendChild(description);
            descriptionContainer.appendChild(seeMoreBtn);
            
            bookRow.appendChild(bookButton);
            
            detailsContainer.appendChild(name);
            detailsContainer.appendChild(descriptionContainer);
            if (note) {
                detailsContainer.appendChild(note);
            }
            detailsContainer.appendChild(metaContainer);
            detailsContainer.appendChild(bookRow);
            
            experienceCard.appendChild(detailsContainer);
            
            return experienceCard;
        }
        
        // Override the updatePageLanguage function to handle experience content
        function updatePageLanguage(lang) {
            // Set the selected language
            const langSelector = document.getElementById('language-selector');
            if (langSelector) {
                langSelector.value = lang;
            }
            
            // Store preferred language
            localStorage.setItem('preferred_language', lang);
            
            // Update all data-i18n elements
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                element.textContent = getTranslation(key, lang);
            });
            
            // Get experiences data for the selected language
            const experiencesData = getTranslation('experiencesData', lang);
            
            // Clear and repopulate the experiences grid
            const experiencesGrid = document.getElementById('experiences-grid');
            if (experiencesGrid) {
                experiencesGrid.innerHTML = '';
                
                experiencesData.forEach(experience => {
                    const card = createExperienceCard(experience);
                    experiencesGrid.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
