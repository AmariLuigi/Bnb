<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sant'Agostino B&B - Experiences</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        :root {
            --primary-color: rgb(185, 43, 19);
            --accent-color: rgb(255, 193, 7);
            --text-color: #333;
            --bg-color: #f9f9f9;
            --card-bg: #fff;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --heading-font: 'Montserrat', sans-serif;
            --body-font: 'Montserrat', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--body-font);
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        header h1 {
            font-family: var(--heading-font);
            font-size: 2.5rem;
            color: var(--text-color);
        }
        
        .language-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px;
            border-radius: 5px;
            z-index: 10;
        }
        
        .language-selector select {
            border: 1px solid #ddd;
            padding: 5px;
            border-radius: 4px;
            font-family: var(--body-font);
        }
        
        .back-button {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            margin-right: 20px;
        }
        
        .back-button i {
            margin-right: 5px;
        }
        
        /* Experience Card Styles */
        .experience-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        
        .experience-card:hover {
            transform: translateY(-5px);
        }
        
        .experience-image {
            height: 160px;
            background-color: rgb(185, 43, 19);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 72px;
            font-weight: 700;
        }
        
        .experience-letter {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .experience-details {
            padding: 20px;
        }
        
        .experience-name {
            font-family: var(--heading-font);
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }
        
        .experience-description {
            margin-bottom: 15px;
            overflow-y: auto;
            max-height: 120px; /* Fixed height for description */
            padding-right: 5px;
            position: relative;
            line-height: 1.5;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) #eee;
        }
        
        .experience-description::-webkit-scrollbar {
            width: 6px;
        }
        
        .experience-description::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .experience-description::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 10px;
        }
        
        .experience-description:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.9));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .experience-description:not(:hover):after {
            opacity: 1;
        }
        
        .experience-meta {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            color: #555;
        }
        
        .meta-item i {
            margin-right: 8px;
            color: var(--primary-color);
            width: 16px;
            text-align: center;
        }
        
        /* Action Buttons */
        .experience-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        
        .action-btn {
            background-color: transparent;
            border: none;
            color: var(--primary-color);
            font-family: var(--body-font);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        .action-btn:hover {
            background-color: rgba(185, 43, 19, 0.1);
        }
        
        .section-title {
            font-family: var(--heading-font);
            font-size: 1.8rem;
            color: var(--text-color);
            margin: 30px 0 20px;
            padding-bottom: 8px;
            border-bottom: 3px solid rgb(185, 43, 19);
            display: inline-block;
        }
        
        /* Experience Grid */
        .attractions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
        }
        
        /* Media Queries */
        @media (max-width: 1024px) {
            .attractions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .attractions-grid {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            header h1 {
                margin-top: 15px;
            }
        }

        /* Tooltip styles */
        .duration-tooltip {
            position: relative;
            display: inline-block;
        }
        
        .duration-tooltip .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #555;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        
        .duration-tooltip .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #555 transparent transparent transparent;
        }
        
        .duration-tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        
        .duration-btn {
            background-color: transparent;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        
        .duration-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <select id="language-select">
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>
    
    <div class="container">
        <header>
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="backToHome">Back to Home</span>
            </a>
            <h1><span style="color: rgb(185, 43, 19);" data-i18n="localExperiences">Local Experiences</span></h1>
        </header>
        
        <section id="experiences-section">
            <h2 class="section-title"><span data-i18n="recommendedExperiences">Recommended Experiences</span></h2>
            <div id="experiences-grid" class="attractions-grid">
                <!-- Experiences will be inserted here -->
            </div>
        </section>
    </div>
    
    <footer style="text-align: center; margin-top: 40px; padding: 20px; background-color: #f1f1f1; font-size: 0.8rem;">
        <p>© 2023 Sant'Agostino B&B. All rights reserved. | Version 1.2.4</p>
    </footer>

    <script src="js/translations.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize
            loadExperiences();
            
            // Set language from URL hash if present
            const hash = window.location.hash.substring(1);
            if (hash && ['en', 'it', 'fr', 'es'].includes(hash)) {
                document.getElementById('language-select').value = hash;
                updatePageLanguage(hash);
            } else {
                // Otherwise, try to load from localStorage
                const savedLang = localStorage.getItem('preferredLanguage');
                if (savedLang) {
                    document.getElementById('language-select').value = savedLang;
                    updatePageLanguage(savedLang);
                }
            }
            
            // Set up language selector
            document.getElementById('language-select').addEventListener('change', (e) => {
                const selectedLang = e.target.value;
                updatePageLanguage(selectedLang);
            });
        });
        
        function createExperienceCard(experience, index) {
            const card = document.createElement('div');
            card.className = 'experience-card';
            
            // Create image or letter placeholder
            const imageDiv = document.createElement('div');
            imageDiv.className = 'experience-image';
            
            const letterDiv = document.createElement('div');
            letterDiv.className = 'experience-letter';
            letterDiv.textContent = experience.name.charAt(0);
            imageDiv.appendChild(letterDiv);
            
            card.appendChild(imageDiv);
            
            // Details container
            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'experience-details';
            
            // Experience name
            const nameElement = document.createElement('h3');
            nameElement.className = 'experience-name';
            nameElement.textContent = experience.name;
            detailsDiv.appendChild(nameElement);
            
            // Description
            const descriptionElement = document.createElement('div');
            descriptionElement.className = 'experience-description';
            descriptionElement.textContent = experience.description;
            detailsDiv.appendChild(descriptionElement);
            
            // Meta information
            const metaDiv = document.createElement('div');
            metaDiv.className = 'experience-meta';
            
            // Duration
            if (experience.duration) {
                const durationElement = document.createElement('div');
                durationElement.className = 'meta-item';
                
                const durationTooltip = document.createElement('div');
                durationTooltip.className = 'duration-tooltip';
                
                const durationBtn = document.createElement('button');
                durationBtn.className = 'duration-btn';
                durationBtn.setAttribute('data-i18n', 'seeDuration');
                durationBtn.textContent = translations[document.getElementById('language-select').value || 'en'].seeDuration[document.getElementById('language-select').value || 'en'];
                
                const tooltipText = document.createElement('span');
                tooltipText.className = 'tooltip-text';
                tooltipText.textContent = experience.duration;
                
                durationTooltip.appendChild(durationBtn);
                durationTooltip.appendChild(tooltipText);
                
                durationElement.innerHTML = `<i class="far fa-clock"></i>`;
                durationElement.appendChild(durationTooltip);
                
                metaDiv.appendChild(durationElement);
            }
            
            // Price
            if (experience.price) {
                const priceElement = document.createElement('div');
                priceElement.className = 'meta-item';
                priceElement.innerHTML = `<i class="fas fa-tag"></i> ${experience.price}`;
                metaDiv.appendChild(priceElement);
            }
            
            detailsDiv.appendChild(metaDiv);
            
            // Action Buttons
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'experience-actions';
            
            // Book Now Button
            const bookBtn = document.createElement('button');
            bookBtn.className = 'action-btn';
            bookBtn.innerHTML = `<i class="fas fa-ticket-alt"></i>`;
            bookBtn.onclick = () => {
                const lang = document.getElementById('language-select').value || 'en';
                alert(translations[lang].contactMessage[lang]);
            };
            
            actionsDiv.appendChild(bookBtn);
            
            detailsDiv.appendChild(actionsDiv);
            
            card.appendChild(detailsDiv);
            
            return card;
        }
        
        function loadExperiences() {
            // Clear existing experience list
            document.getElementById('experiences-grid').innerHTML = '';
            
            // Default to English if no language is set
            const lang = document.getElementById('language-select').value || 'en';
            
            // Get experience data for the selected language
            const experiences = translations[lang].experiences;
            
            // Add experiences
            experiences.forEach((experience, index) => {
                const card = createExperienceCard(experience, index);
                document.getElementById('experiences-grid').appendChild(card);
            });
        }
        
        function updatePageLanguage(lang) {
            // Update language selector
            document.getElementById('language-select').value = lang;
            
            // Store in localStorage for future visits
            localStorage.setItem('preferredLanguage', lang);
            
            // Update URL hash
            window.location.hash = lang;
            
            // Update translation elements
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if (typeof translations[lang][key] === 'object') {
                        element.textContent = translations[lang][key][lang];
                    } else {
                        element.textContent = translations[lang][key];
                    }
                }
            });
            
            // Repopulate experiences
            loadExperiences();
            
            // Update back button text
            document.querySelector('.back-button span').textContent = translations[lang].backToHome[lang];
        }
    </script>
</body>
</html>
