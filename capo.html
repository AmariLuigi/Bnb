<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capo Quarter - Sant'Agostino BnB Palermo Map</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="quarter-page capo-bg">
    <div class="container">
        <header>
            <h1>Capo Quarter</h1>
            <a href="index.html" class="back-btn">← Back to Map</a>
        </header>
        
        <div class="quarter-info">
            <div class="qr-section">
                <h2>Scan to visit this page</h2>
                <div id="page-qrcode" class="qrcode-large"></div>
                <button id="printQR" class="btn">Print QR Code</button>
            </div>
            
            <div class="attractions">
                <h2>Places to Visit</h2>
                <ul id="attractions-list">
                    <!-- Attractions will be loaded dynamically by JavaScript -->
                </ul>
            </div>
        </div>
        
        <footer>
            <p>© Sant'Agostino BnB - Palermo Map</p>
        </footer>
    </div>
    
    <!-- QR Code library -->
    <script src="js/qrcode.min.js"></script>
    <!-- Centralized quarters data loader - manages dynamic content from data/quarters.json -->
    <script src="js/quarters.js"></script>
</body>
</html>
