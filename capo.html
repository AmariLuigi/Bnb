<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capo Quarter - Sant'Agostino BnB Palermo Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .language-selector label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        .language-selector select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .section-title {
            font-size: 1.8rem;
            color: #333;
            margin: 30px 0 20px;
            border-bottom: 2px solid rgb(185, 43, 19);
            padding-bottom: 8px;
            display: inline-block;
        }
    </style>
</head>
<body class="quarter-page capo-bg">
    <div class="language-selector">
        <label for="language-selector" data-i18n="language">Language</label>
        <select id="language-selector" onchange="updatePageLanguage(this.value)">
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="container">
        <header>
            <h1 data-i18n="capo"><span style="color: rgb(185, 43, 19);">Capo</span> Quarter</h1>
            <a href="index.html" class="back-btn" data-i18n="back">← Back to Map</a>
        </header>
        
        <div class="quarter-content">
            <div class="attractions">
                <h2 data-i18n="placesToVisit">Places to Visit</h2>
                <div class="settings-panel">
                    <label class="toggle-switch">
                        <input type="checkbox" id="dynamic-images-toggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Use dynamic images</span>
                    </label>
                </div>
                <div id="attractions-grid" class="attractions-grid">
                    <!-- Attractions will be loaded dynamically by JavaScript -->
                </div>
            </div>
        </div>
        
        <footer>
            <p data-i18n="copyright">© Sant'Agostino BnB - Palermo Map</p>
        </footer>
    </div>
    
    <script src="js/qrcode.min.js"></script>
    <script src="js/translations.js"></script>
    <script>
        // Ensure attractions are initialized on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize toggle based on localStorage
            const dynamicImagesToggle = document.getElementById('dynamic-images-toggle');
            dynamicImagesToggle.checked = localStorage.getItem('use_dynamic_images') === 'true';
            
            // Add event listener for toggle
            dynamicImagesToggle.addEventListener('change', function() {
                localStorage.setItem('use_dynamic_images', this.checked);
                // Reload attractions with new setting
                const savedLang = localStorage.getItem('preferred_language') || 'en';
                updatePageLanguage(savedLang);
            });
            
            // Force attractions to load
            const savedLang = localStorage.getItem('preferred_language') || 'en';
            updatePageLanguage(savedLang);
        });
    </script>
</body>
</html>
